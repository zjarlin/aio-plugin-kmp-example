name: Verify v2 fullstack plugin

on:
  workflow_dispatch:
    inputs:
      platform_revision:
        description: Full aio-platform commit containing the v2 runtime
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aio_test_admin
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: aio_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      AIO_PLATFORM: ${{ github.workspace }}/aio-platform
      AIO_TEST_DATABASE_URL: postgres://aio_test_admin:integration-only@127.0.0.1:5432/aio_test
      AIO_TEST_COMPONENT: ${{ github.workspace }}/dist/plugin.wasm
      AIO_TEST_MIGRATION: ${{ github.workspace }}/backend/migrations/0001_counter.sql
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check immutable platform revision
        env:
          PLATFORM_REVISION: ${{ inputs.platform_revision }}
        run: test "${#PLATFORM_REVISION}" -eq 40 && ! printf '%s' "$PLATFORM_REVISION" | grep -q '[^0-9a-f]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zjarlin/aio-platform
          ref: ${{ inputs.platform_revision }}
          path: aio-platform
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Install component toolchain
        run: |
          cargo install --locked --git https://github.com/Kotlin/wit-bindgen.git --rev 700f2db5e1d01f7bee8d756750c6f631171f520e wit-bindgen-cli
          cargo install --locked wasm-tools --version 1.240.0
      - name: Generate, build and test
        run: |
          sh scripts/generate-bindings.sh
          git diff --exit-code -- backend/component/src
          ./kotlin test -m shared -p jvm
          ./kotlin test -m service -p jvm
          sh scripts/build.sh
          sh scripts/build-component.sh
      - name: Verify real Kotlin component and PostgreSQL isolation
        working-directory: aio-platform
        run: |
          psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC'
          cargo test -p az-plugin-runtime --lib -- --include-ignored
          cargo test -p az-plugin-runtime --test component -- --ignored --nocapture
